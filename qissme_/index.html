<script>
// Настоящая страница нужна мессенджерам: по ней они рисуют карточку ссылки (tools/og_cards.py). Человека сразу
// переводим на страницу ведущего за решёткой — как это делает 404.html для остальных адресов.
(function () {
  var base = location.pathname.indexOf('/lobby/') === 0 ? '/lobby/' : '/';
  // счётчик посещений (js/visit.js) узнает отсюда, откуда человек пришёл на самом деле
  try { if (document.referrer) sessionStorage.setItem('ae-ref', document.referrer); } catch (e) {}
  location.replace(base + '#/qissme_' + location.search);
})();
</script>
